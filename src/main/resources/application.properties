spring.application.name=obraia-backend

# Locally, variables are read from the .env file (never committed to Git).
# On Render, variables are set in the service dashboard.
spring.config.import=optional:file:.env[.properties]

# Render provides the port in the PORT variable; 8080 is used locally.
server.port=${PORT:8080}

# Database: always from environment variables, never hardcoded here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Give up after 10 seconds if the database does not answer (default is 30).
spring.datasource.hikari.connection-timeout=10000

# Tables only change through Flyway migrations. Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway applies the scripts in db/migration in order, only once.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Frontend URLs allowed to call the API (CORS), separated by commas.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
