spring.application.name=obraia-backend

# Locally, variables are read from the .env file (never committed to Git).
# On Render, variables are set in the service dashboard.
spring.config.import=optional:file:.env[.properties]

# Render provides the port in the PORT variable; 8080 is used locally.
server.port=${PORT:8080}

# Database: always from environment variables, never hardcoded here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Give up after 10 seconds if the database does not answer (default is 30).
spring.datasource.hikari.connection-timeout=10000

# Tables only change through Flyway migrations. Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway applies the scripts in db/migration in order, only once.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Frontend URLs allowed to call the API (CORS), separated by commas.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Swagger UI and the OpenAPI document.
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/docs.json

# Access tokens (JWT). JWT_SECRET must be a random text of at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=obraia-backend
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# Lifetime of the links sent by email.
app.auth.verification-token-ttl=24h
app.auth.password-reset-token-ttl=30m

# Project deletion: the email link works 30 minutes; data is removed for good 30 days later.
app.projects.deletion-link-ttl=30m
app.projects.purge-after=30d

# Emails: "log" only writes them to the console; "brevo" sends them.
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from-email=${MAIL_FROM:no-reply@obraia.local}
app.mail.from-name=ObraIA
app.mail.brevo-api-key=${BREVO_API_KEY:}

# Quotation: daily cost of the crew (a builder and a helper) in COP, and the VAT
# added to labor and transport (material prices already include it).
app.quotation.labor-daily-rate=280000
app.quotation.vat-pct=19

# Blueprints: "database" keeps the files in PostgreSQL (needed on Render, whose
# disk is erased on every deploy); "local" keeps them in a folder.
app.storage.provider=${STORAGE_PROVIDER:database}
app.storage.local-dir=uploads
app.storage.max-file-size=10MB
app.storage.max-files-per-project=10
spring.servlet.multipart.max-file-size=10MB
# The form adds a few bytes around the file.
spring.servlet.multipart.max-request-size=11MB

# AI service (obraia-ia) that reads the blueprints. Without AI_SERVICE_URL the
# analysis is off. The token is the SERVICE_TOKEN of that service.
app.ai.base-url=${AI_SERVICE_URL:}
app.ai.service-token=${AI_SERVICE_TOKEN:}
app.ai.connect-timeout=10s
# Render's free plan sleeps the service; the first call can take about a minute.
app.ai.read-timeout=150s
# Calls to the AI each project can make per hour (the model has a free quota).
app.ai.max-analyses-per-project=5
app.ai.limit-window=1h
app.ai.cache-size=50
